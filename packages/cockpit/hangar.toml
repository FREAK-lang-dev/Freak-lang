[project]
name = "cockpit"
version = "0.2.0"
kind = "lib"
author = "FREAK Core Team"
edition = "alternative-3"
description = "Fly a native UI by hand, every frame. Source-only immediate-mode widgets, layout, themes, caret editing, charts, toasts and motion for FREAK (Windows window backend)."
readme = "README.md"

[modules]
containers = "src/containers.fk"
blackbox = "src/blackbox.fk"
