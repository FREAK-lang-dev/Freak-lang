# Comparison point: nginx serving the same static files and a fixed JSON reply.
# Run with: nginx -c "$PWD/http_server_nginx.conf" -p "$PWD" (point root at the app's public/)
worker_processes 4;
pid nginx.pid;
error_log nginx-error.log;
events { worker_connections 4096; }
http {
  access_log off;
  include /etc/nginx/mime.types;
  server { listen 127.0.0.1:9400; root public;
    add_header X-Content-Type-Options nosniff; add_header X-Frame-Options DENY;
    location /api/v1/hello/ { default_type application/json; return 200 '{"hello":"Ada"}'; }
    location / { try_files $uri /index.html; } }
}
