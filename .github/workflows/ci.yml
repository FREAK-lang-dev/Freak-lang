name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CLANG_FLAGS: "-w -O2 -D_CRT_SECURE_NO_WARNINGS"

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Release version invariant
        shell: bash
        run: python -u tools/release_version.py check

      - name: Install Clang (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang lld

      - name: Install Clang (Windows)
        if: runner.os == 'Windows'
        run: choco install llvm -y

      - name: Set platform linker flags
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            echo "LINK_FLAGS=-lm" >> "$GITHUB_ENV"
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "LINK_FLAGS=-lws2_32" >> "$GITHUB_ENV"
          else
            echo "LINK_FLAGS=" >> "$GITHUB_ENV"
          fi
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "EXT=.exe" >> "$GITHUB_ENV"
          else
            echo "EXT=" >> "$GITHUB_ENV"
          fi

      - name: V3 clean self-host fixed point
        shell: bash
        run: python -u tests/v3_fixed_point.py

      - name: Build V3 compiler (Stage 0 — link pre-compiled bootstrap)
        shell: bash
        run: |
          cat src/compiler/v3/globals.fk src/compiler/v3/helpers.fk src/compiler/v3/lexer.fk src/compiler/v3/parser.fk src/compiler/v3/checker.fk src/compiler/v3/emit_c.fk src/compiler/v3/emit_llvm.fk src/compiler/v3/main.fk > build/freakc_v3.fk
          clang -o build/freakc_v3$EXT build/freakc_v3.fk.c freakc/runtime/freak_runtime.c -Ifreakc/runtime $CLANG_FLAGS $LINK_FLAGS
          ./build/freakc_v3$EXT build/freakc_v3.fk --c
          clang -o build/freakc_v3_stage2$EXT build/freakc_v3.fk.c freakc/runtime/freak_runtime.c -Ifreakc/runtime $CLANG_FLAGS $LINK_FLAGS

      - name: Build full CLI (Stage 2 — current V3 compiler + CLI + Hangar)
        shell: bash
        run: |
          mkdir -p build
          rm -f build/freakc_cli.fk
          cat std/version.fk >> build/freakc_cli.fk
          cat src/compiler/v3/globals.fk >> build/freakc_cli.fk
          cat src/compiler/v3/helpers.fk >> build/freakc_cli.fk
          cat src/compiler/v3/lexer.fk >> build/freakc_cli.fk
          cat src/compiler/v3/parser.fk >> build/freakc_cli.fk
          cat src/compiler/v3/checker.fk >> build/freakc_cli.fk
          cat src/compiler/v3/emit_c.fk >> build/freakc_cli.fk
          cat src/compiler/v3/emit_llvm.fk >> build/freakc_cli.fk
          cat src/cli/version.fk >> build/freakc_cli.fk
          cat src/cli/toml.fk >> build/freakc_cli.fk
          cat src/cli/lockfile.fk >> build/freakc_cli.fk
          cat src/cli/build.fk >> build/freakc_cli.fk
          cat src/cli/run.fk >> build/freakc_cli.fk
          cat src/cli/hangar.fk >> build/freakc_cli.fk
          cat src/cli/doctor.fk >> build/freakc_cli.fk
          cat src/cli/audit.fk >> build/freakc_cli.fk
          cat src/cli/main.fk >> build/freakc_cli.fk
          ./build/freakc_v3_stage2$EXT build/freakc_cli.fk --c
          clang -o build/freak$EXT build/freakc_cli.fk.c freakc/runtime/freak_runtime.c -Ifreakc/runtime $CLANG_FLAGS $LINK_FLAGS
          # Create hangar binary (BusyBox pattern)
          cp build/freak$EXT build/hangar$EXT

      - name: Pre-compile Windows runtime objects
        if: runner.os == 'Windows'
        shell: bash
        run: |
          clang -c freakc/runtime/freak_runtime.c -Ifreakc/runtime $CLANG_FLAGS -o freakc/runtime/freak_runtime.obj
          clang -c freakc/runtime/freak_llvm_runtime.c -Ifreakc/runtime $CLANG_FLAGS -DFREAK_HAS_UI -o freakc/runtime/freak_llvm_runtime.obj
          clang -c freakc/runtime/ui/win32_backend.c -Ifreakc/runtime/ui $CLANG_FLAGS -o freakc/runtime/freak_ui_win32.obj

      - name: CLI smoke test — version
        shell: bash
        run: ./build/freak$EXT version

      - name: V3 parser/type errors gate code generation
        shell: bash
        run: python -u tests/v3_codegen_error_gate.py ./build/freak$EXT

      - name: V3 word replacement ownership
        shell: bash
        run: python -u tests/v3_word_ownership.py ./build/freak$EXT

      - name: V3 repeated word concat scaling
        shell: bash
        run: python -u tests/v3_word_concat.py ./build/freak$EXT

      - name: V3 path interpolation
        shell: bash
        run: python -u tests/v3_interpolation.py ./build/freak$EXT

      - name: V3 frozen UI surface
        shell: bash
        run: python -u tests/v3_ui_surface.py ./build/freak$EXT

      - name: CLI smoke test - doctor JSON
        shell: bash
        run: |
          ./build/freak$EXT doctor --json > doctor.json
          python - <<'PY'
          import json
          with open("doctor.json", "r", encoding="utf-8") as handle:
              doc = json.load(handle)
          assert doc["schema"] == "freak.doctor.v1"
          assert doc["checks"]["stdlib"]["modules_expected"] == 11
          assert "clang" in doc["checks"]
          PY

      - name: CLI smoke test — build + run hello.fk
        shell: bash
        run: |
          ./build/freak$EXT build tests/hello.fk
          ./tests/hello$EXT

      - name: Test — hello.fk (LLVM backend)
        shell: bash
        run: |
          ./build/freak$EXT build tests/hello.fk
          ./tests/hello$EXT

      - name: Test — hello.fk (C backend)
        shell: bash
        run: |
          ./build/freak$EXT build tests/hello.fk --c
          ./tests/hello$EXT

      - name: Test — control_flow.fk (LLVM backend)
        shell: bash
        run: |
          ./build/freak$EXT build tests/control_flow.fk
          ./tests/control_flow$EXT

      - name: Test — control_flow.fk (C backend)
        shell: bash
        run: |
          ./build/freak$EXT build tests/control_flow.fk --c
          ./tests/control_flow$EXT

      - name: Test — std library (LLVM backend)
        shell: bash
        run: |
          ./build/freak$EXT build tests/std_test.fk
          ./tests/std_test$EXT

      - name: Test — std library (C backend)
        shell: bash
        run: |
          ./build/freak$EXT build tests/std_test.fk --c
          ./tests/std_test$EXT

      - name: Test — JSON parser
        shell: bash
        run: |
          ./build/freak$EXT build tests/json_test.fk
          ./tests/json_test$EXT

      - name: Test — file I/O runtime
        shell: bash
        run: |
          ./build/freak$EXT build tests/fs_runtime_test.fk
          ./tests/fs_runtime_test$EXT

      - name: Test - V3 run freshness and installer cleanup
        shell: bash
        run: python -u tests/v3_run_freshness.py ./build/freak$EXT

      - name: Test - V3 install, doctor, and upgrade
        shell: bash
        run: python -u tests/v3_install_doctor_upgrade.py ./build/freak$EXT

      - name: Test - release-shaped installed compiler
        shell: bash
        run: python -u tests/v3_release_install_smoke.py ./build/freak$EXT ./build/hangar$EXT

      - name: Test suite (regression tests)
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            powershell -NoProfile -File tests/suite/run_tests.ps1 ./build/freak.exe
          else
            chmod +x tests/suite/run_tests.sh
            ./tests/suite/run_tests.sh ./build/freak
          fi

