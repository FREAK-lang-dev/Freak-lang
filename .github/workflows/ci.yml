name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CLANG_FLAGS: "-w -O2 -D_CRT_SECURE_NO_WARNINGS"

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Clang (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang lld

      - name: Install Clang (Windows)
        if: runner.os == 'Windows'
        run: choco install llvm -y

      - name: Set platform linker flags
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            echo "LINK_FLAGS=-lm" >> "$GITHUB_ENV"
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "LINK_FLAGS=-lws2_32" >> "$GITHUB_ENV"
          else
            echo "LINK_FLAGS=" >> "$GITHUB_ENV"
          fi

      - name: Build v2 compiler (Stage 0 — Python bootstrap)
        shell: bash
        run: |
          python -m freakc build self_hosted/main.fk -o self_hosted/freakc_self.exe --keep-c

      - name: Build v2 compiler (Stage 1 — concatenate + compile)
        shell: bash
        run: |
          cat src/compiler/ast.fk src/compiler/lexer.fk src/compiler/parser.fk src/compiler/checker.fk src/compiler/emitter.fk src/compiler/backend/llvm.fk src/compiler/main.fk > build/freakc_v2.fk
          ./self_hosted/freakc_self.exe build/freakc_v2.fk
          clang -o build/freakc_v2.exe build/freakc_v2.fk.c freakc/runtime/freak_runtime.c -Ifreakc/runtime $CLANG_FLAGS $LINK_FLAGS

      - name: Test — hello.fk (LLVM backend, default)
        shell: bash
        run: |
          ./build/freakc_v2.exe tests/hello.fk
          clang -o tests/hello_llvm_ci.exe tests/hello.fk.ll freakc/runtime/freak_llvm_runtime.c -Ifreakc/runtime $CLANG_FLAGS $LINK_FLAGS
          ./tests/hello_llvm_ci.exe

      - name: Test — hello.fk (C backend, explicit)
        shell: bash
        run: |
          ./build/freakc_v2.exe tests/hello.fk --c
          clang -o tests/hello_ci.exe tests/hello.fk.c freakc/runtime/freak_runtime.c -Ifreakc/runtime $CLANG_FLAGS $LINK_FLAGS
          ./tests/hello_ci.exe

      - name: Test — control_flow.fk (C backend)
        shell: bash
        run: |
          ./build/freakc_v2.exe tests/control_flow.fk --c
          clang -o tests/control_flow_ci.exe tests/control_flow.fk.c freakc/runtime/freak_runtime.c -Ifreakc/runtime $CLANG_FLAGS $LINK_FLAGS
          ./tests/control_flow_ci.exe

      - name: Test — control_flow.fk (LLVM backend)
        shell: bash
        run: |
          ./build/freakc_v2.exe tests/control_flow.fk --llvm
          clang -o tests/control_flow_llvm_ci.exe tests/control_flow.fk.ll freakc/runtime/freak_llvm_runtime.c -Ifreakc/runtime $CLANG_FLAGS $LINK_FLAGS
          ./tests/control_flow_llvm_ci.exe

      - name: Test — std library (LLVM backend)
        shell: bash
        run: |
          cat std/math.fk std/string.fk std/convert.fk tests/std_test.fk > tests/std_ci.fk
          ./build/freakc_v2.exe tests/std_ci.fk
          clang -o tests/std_ci.exe tests/std_ci.fk.ll freakc/runtime/freak_llvm_runtime.c -Ifreakc/runtime $CLANG_FLAGS $LINK_FLAGS
          ./tests/std_ci.exe

      - name: Test — std library (C backend)
        shell: bash
        run: |
          cat std/math.fk std/string.fk std/convert.fk tests/std_test.fk > tests/std_ci_c.fk
          ./build/freakc_v2.exe tests/std_ci_c.fk --c
          clang -o tests/std_ci_c.exe tests/std_ci_c.fk.c freakc/runtime/freak_runtime.c -Ifreakc/runtime $CLANG_FLAGS $LINK_FLAGS
          ./tests/std_ci_c.exe

      - name: Test — JSON parser (LLVM backend)
        shell: bash
        run: |
          cat std/math.fk std/string.fk std/convert.fk std/algorithm.fk std/json.fk tests/json_test.fk > tests/json_ci.fk
          ./build/freakc_v2.exe tests/json_ci.fk
          clang -o tests/json_ci.exe tests/json_ci.fk.ll freakc/runtime/freak_llvm_runtime.c -Ifreakc/runtime $CLANG_FLAGS $LINK_FLAGS
          ./tests/json_ci.exe

      - name: Self-hosting bootstrap test
        shell: bash
        run: |
          ./build/freakc_v2.exe tests/hello.fk --c
          clang -o tests/hello_bootstrap.exe tests/hello.fk.c freakc/runtime/freak_runtime.c -Ifreakc/runtime $CLANG_FLAGS $LINK_FLAGS
          echo "--- Bootstrap verification output ---"
          ./tests/hello_bootstrap.exe
