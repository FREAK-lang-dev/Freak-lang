name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CLANG_FLAGS: "-w -O2 -D_CRT_SECURE_NO_WARNINGS"

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Clang (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang lld

      - name: Install Clang (Windows)
        if: runner.os == 'Windows'
        run: choco install llvm -y

      - name: Set platform linker flags
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            echo "LINK_FLAGS=-lm" >> "$GITHUB_ENV"
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "LINK_FLAGS=-lws2_32" >> "$GITHUB_ENV"
          else
            echo "LINK_FLAGS=" >> "$GITHUB_ENV"
          fi
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "EXT=.exe" >> "$GITHUB_ENV"
          else
            echo "EXT=" >> "$GITHUB_ENV"
          fi

      - name: Build v2 compiler (Stage 0 — Python bootstrap)
        shell: bash
        run: |
          python -m freakc build self_hosted/main.fk -o self_hosted/freakc_self$EXT --keep-c

      - name: Build v2 compiler (Stage 1 — concatenate + compile)
        shell: bash
        run: |
          cat src/compiler/ast.fk src/compiler/lexer.fk src/compiler/parser.fk src/compiler/checker.fk src/compiler/emitter.fk src/compiler/backend/llvm.fk src/compiler/main.fk > build/freakc_v2.fk
          ./self_hosted/freakc_self$EXT build/freakc_v2.fk
          clang -o build/freakc_v2$EXT build/freakc_v2.fk.c freakc/runtime/freak_runtime.c -Ifreakc/runtime $CLANG_FLAGS $LINK_FLAGS

      - name: Build full CLI (Stage 2 — compiler + CLI + Hangar)
        shell: bash
        run: |
          mkdir -p build
          rm -f build/freakc_cli.fk
          cat std/version.fk >> build/freakc_cli.fk
          cat src/compiler/ast.fk >> build/freakc_cli.fk
          cat src/compiler/lexer.fk >> build/freakc_cli.fk
          cat src/compiler/parser.fk >> build/freakc_cli.fk
          cat src/compiler/checker.fk >> build/freakc_cli.fk
          cat src/compiler/emitter.fk >> build/freakc_cli.fk
          cat src/compiler/backend/llvm.fk >> build/freakc_cli.fk
          cat src/cli/version.fk >> build/freakc_cli.fk
          cat src/cli/toml.fk >> build/freakc_cli.fk
          cat src/cli/lockfile.fk >> build/freakc_cli.fk
          cat src/cli/build.fk >> build/freakc_cli.fk
          cat src/cli/run.fk >> build/freakc_cli.fk
          cat src/cli/hangar.fk >> build/freakc_cli.fk
          cat src/cli/doctor.fk >> build/freakc_cli.fk
          cat src/cli/main.fk >> build/freakc_cli.fk
          ./build/freakc_v2$EXT build/freakc_cli.fk --c
          clang -o build/freak$EXT build/freakc_cli.fk.c freakc/runtime/freak_runtime.c -Ifreakc/runtime $CLANG_FLAGS $LINK_FLAGS
          # Create hangar symlink/copy (BusyBox pattern)
          cp build/freak$EXT build/hangar$EXT

      - name: CLI smoke test — version
        shell: bash
        run: ./build/freak$EXT version

      - name: CLI smoke test — build + run hello.fk
        shell: bash
        run: |
          ./build/freak$EXT build tests/hello.fk
          ./tests/hello$EXT

      - name: Test — hello.fk (LLVM backend)
        shell: bash
        run: |
          ./build/freak$EXT build tests/hello.fk
          ./tests/hello$EXT

      - name: Test — hello.fk (C backend)
        shell: bash
        run: |
          ./build/freak$EXT build tests/hello.fk --c
          ./tests/hello$EXT

      - name: Test — control_flow.fk (LLVM backend)
        shell: bash
        run: |
          ./build/freak$EXT build tests/control_flow.fk
          ./tests/control_flow$EXT

      - name: Test — control_flow.fk (C backend)
        shell: bash
        run: |
          ./build/freak$EXT build tests/control_flow.fk --c
          ./tests/control_flow$EXT

      - name: Test — std library (LLVM backend)
        shell: bash
        run: |
          ./build/freak$EXT build tests/std_test.fk
          ./tests/std_test$EXT

      - name: Test — std library (C backend)
        shell: bash
        run: |
          ./build/freak$EXT build tests/std_test.fk --c
          ./tests/std_test$EXT

      - name: Test — JSON parser
        shell: bash
        run: |
          ./build/freak$EXT build tests/json_test.fk
          ./tests/json_test$EXT

      - name: Test — file I/O runtime
        shell: bash
        run: |
          ./build/freak$EXT build tests/fs_runtime_test.fk
          ./tests/fs_runtime_test$EXT

      - name: Self-hosting bootstrap test
        shell: bash
        run: |
          ./build/freakc_v2$EXT tests/hello.fk --c
          clang -o tests/hello_bootstrap$EXT tests/hello.fk.c freakc/runtime/freak_runtime.c -Ifreakc/runtime $CLANG_FLAGS $LINK_FLAGS
          echo "--- Bootstrap verification output ---"
          ./tests/hello_bootstrap$EXT
