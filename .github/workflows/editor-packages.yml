name: Editor packages

on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - 'editors/**'
      - 'tools/package_editors.py'
      - 'tools/release_version.py'
      - 'tests/editor_*.py'
      - 'VERSION'
      - '.github/workflows/editor-packages.yml'
      - '.github/workflows/release.yml'
  push:
    branches: [main]
    paths:
      - 'editors/**'
      - 'tools/package_editors.py'
      - 'tools/release_version.py'
      - 'tests/editor_*.py'
      - 'VERSION'
      - '.github/workflows/editor-packages.yml'
      - '.github/workflows/release.yml'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editors/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix editors
      - name: Verify highlighting
        run: |
          npm test --prefix editors
          python -u tests/editor_grammars.py
      - name: Build and verify installable editor assets
        run: |
          python -u tools/release_version.py check
          python -u tools/package_editors.py --output dist/editors
          python -u tests/editor_packages.py --artifacts dist/editors
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: editor-packages
          path: dist/editors/
          if-no-files-found: error
