name: Locked V4 bootstrap

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  LLVM_MINGW_VERSION: "20260616"
  LLVM_MINGW_SHA256: "b9b68a4d276e16fa25802aaba458e4638f64b3884c290aaccdc2d87083b6ca35"
  FREAK_V4_CI_CLANG: clang

jobs:
  native-public-bootstrap:
    name: Locked V4 public bootstrap (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Clang (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Install pinned GNU-targeting LLVM-MinGW (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "llvm-mingw-$env:LLVM_MINGW_VERSION-ucrt-x86_64.zip"
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$env:LLVM_MINGW_VERSION/llvm-mingw-$env:LLVM_MINGW_VERSION-ucrt-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive -UseBasicParsing
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:LLVM_MINGW_SHA256) {
            throw "LLVM-MinGW checksum mismatch: expected $env:LLVM_MINGW_SHA256, got $actual"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP -Force
          $bin = Join-Path $env:RUNNER_TEMP "llvm-mingw-$env:LLVM_MINGW_VERSION-ucrt-x86_64\bin"
          $clangPath = Join-Path $bin "clang.exe"
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "FREAK_V4_CI_CLANG=$clangPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $clangPath --version
          $triple = & $clangPath -dumpmachine
          if ($LASTEXITCODE -ne 0 -or $triple -notmatch '^x86_64-.*windows-gnu$') {
            throw "Locked V4 bootstrap requires the GNU Windows host profile: $triple"
          }
      - name: Checked source runtime platform and fault regressions
        run: >
          python -B -u tests/v4_bootstrap_runtime_ci.py
          --clang "${{ env.FREAK_V4_CI_CLANG }}"
          --report "${{ runner.temp }}/freak-v4-runtime-ci.json"
      - name: Observe native Windows bootstrap directory operations
        if: runner.os == 'Windows'
        run: >
          python -B -u tests/v4_bootstrap_fs_probe.py
          --clang "${{ env.FREAK_V4_CI_CLANG }}"
          --report "${{ runner.temp }}/freak-v4-bootstrap-fs-probe.json"
      - name: Reconstruct CLI and verify installed public locked bootstrap
        run: >
          python -B -u tests/v3_v4_bootstrap_ci.py
          --clang "${{ env.FREAK_V4_CI_CLANG }}"
          --output "${{ runner.temp }}/freak-v4-locked-bootstrap"
      - name: Verify native Windows checked filesystem barriers
        if: runner.os == 'Windows'
        run: >
          python -B -u tests/v3_v35_windows_fs.py
          --clang "${{ env.FREAK_V4_CI_CLANG }}"
          --optimization 0 --optimization 2 --optimization 3
          --report "${{ runner.temp }}/freak-v4-windows-fs.json"
      - name: Verify native word-call ownership and copied bytes (Linux)
        if: runner.os == 'Linux'
        run: >
          python -B -u tests/v3_v4_word_call_borrowing.py
          --compiler "${{ runner.temp }}/freak-v4-locked-bootstrap/reconstruction/freakc_stage2"
          --clang "${{ env.FREAK_V4_CI_CLANG }}"
          --sanitize --optimization O2
          --report "${{ runner.temp }}/freak-v4-word-call-ownership.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: locked-v4-bootstrap-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/freak-v4-locked-bootstrap/reconstruction.json
            ${{ runner.temp }}/freak-v4-locked-bootstrap/public-contracts.json
            ${{ runner.temp }}/freak-v4-runtime-ci.json
            ${{ runner.temp }}/freak-v4-word-call-ownership.json
            ${{ runner.temp }}/freak-v4-bootstrap-fs-probe.json
            ${{ runner.temp }}/freak-v4-windows-fs.json
          if-no-files-found: warn
