name: Release

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      expected_source_commit:
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
  LLVM_MINGW_VERSION: "20260616"
  LLVM_MINGW_SHA256: "b9b68a4d276e16fa25802aaba458e4638f64b3884c290aaccdc2d87083b6ca35"

jobs:
  version-invariant:
    runs-on: ubuntu-latest
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Require tag, compiler, and package versions to agree
        run: python -u tools/release_version.py check --tag "${RELEASE_TAG}"
      - name: Require release notes for the tagged version
        run: test -s "docs/releases/${RELEASE_TAG}.md"
      - name: Bind all release jobs to the checked source commit
        id: source
        env:
          EXPECTED_SOURCE_COMMIT: ${{ inputs.expected_source_commit }}
        run: |
          selected_commit=$(git rev-parse HEAD)
          if [[ -n "$EXPECTED_SOURCE_COMMIT" ]]; then
            test "$selected_commit" = "$EXPECTED_SOURCE_COMMIT"
          fi
          echo "commit=$selected_commit" >> "$GITHUB_OUTPUT"

  editors:
    needs: version-invariant
    uses: ./.github/workflows/editor-packages.yml
    with:
      source_ref: ${{ needs.version-invariant.outputs.source_commit }}

  build:
    needs: version-invariant
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            ext: ""
          - os: ubuntu-24.04-arm
            target: linux-arm64
            ext: ""
          - os: macos-latest
            target: macos-arm64
            ext: ""
          - os: windows-latest
            target: windows-x64
            ext: ".exe"
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version-invariant.outputs.source_commit }}

      - name: Install Clang (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang lld

      - name: Install pinned LLVM-MinGW (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "llvm-mingw-$env:LLVM_MINGW_VERSION-ucrt-x86_64.zip"
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$env:LLVM_MINGW_VERSION/llvm-mingw-$env:LLVM_MINGW_VERSION-ucrt-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive -UseBasicParsing
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:LLVM_MINGW_SHA256) {
            throw "LLVM-MinGW checksum mismatch: expected $env:LLVM_MINGW_SHA256, got $actual"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP -Force
          $bin = Join-Path $env:RUNNER_TEMP "llvm-mingw-$env:LLVM_MINGW_VERSION-ucrt-x86_64\bin"
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $clangPath = Join-Path $bin "clang.exe"
          "FREAK_CLANG=$clangPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $clangPath --version

      - name: Set platform linker flags
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            echo "LINK_FLAGS=-lm" >> "$GITHUB_ENV"
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "LINK_FLAGS=-lws2_32" >> "$GITHUB_ENV"
          else
            echo "LINK_FLAGS=" >> "$GITHUB_ENV"
          fi

      - name: Build V3 compiler (Stage 0 — link pre-compiled bootstrap)
        shell: bash
        run: |
          cat src/compiler/v3/globals.fk src/compiler/v3/helpers.fk src/compiler/v3/lexer.fk src/compiler/v3/parser.fk src/compiler/v3/checker.fk src/compiler/v3/emit_c.fk src/compiler/v3/emit_llvm.fk src/compiler/v3/main.fk > build/freakc_v3.fk
          clang -o build/freakc_v3${{ matrix.ext }} build/freakc_v3.fk.c freakc/runtime/freak_runtime.c -Ifreakc/runtime -w -O2 -D_CRT_SECURE_NO_WARNINGS $LINK_FLAGS
          ./build/freakc_v3${{ matrix.ext }} build/freakc_v3.fk --c
          clang -o build/freakc_v3_stage2${{ matrix.ext }} build/freakc_v3.fk.c freakc/runtime/freak_runtime.c -Ifreakc/runtime -w -O2 -D_CRT_SECURE_NO_WARNINGS $LINK_FLAGS

      - name: Build full CLI (Stage 2 — current V3 compiler + CLI + Hangar)
        shell: bash
        run: |
          mkdir -p build
          rm -f build/freakc_cli.fk
          while IFS= read -r source; do
            cat "$source" >> build/freakc_cli.fk
          done < packaging/cli-sources.manifest
          ./build/freakc_v3_stage2${{ matrix.ext }} build/freakc_cli.fk --c
          clang -o build/freak${{ matrix.ext }} build/freakc_cli.fk.c freakc/runtime/freak_runtime.c -Ifreakc/runtime -O2 -w -D_CRT_SECURE_NO_WARNINGS $LINK_FLAGS
          # Create hangar binary (same binary, BusyBox pattern)
          cp build/freak${{ matrix.ext }} build/hangar${{ matrix.ext }}

      - name: Pre-compile Windows runtime objects
        if: runner.os == 'Windows'
        shell: bash
        run: |
          clang -c freakc/runtime/freak_runtime.c -Ifreakc/runtime -O2 -w -D_CRT_SECURE_NO_WARNINGS -o freakc/runtime/freak_runtime.obj
          clang -c freakc/runtime/freak_llvm_runtime.c -Ifreakc/runtime -O2 -w -D_CRT_SECURE_NO_WARNINGS -DFREAK_HAS_UI -o freakc/runtime/freak_llvm_runtime.obj
          clang -c freakc/runtime/ui/win32_backend.c -Ifreakc/runtime/ui -O2 -w -D_CRT_SECURE_NO_WARNINGS -o freakc/runtime/freak_ui_win32.obj

      - name: Smoke test (CLI build command)
        shell: bash
        run: |
          ./build/freak${{ matrix.ext }} build tests/hello.fk
          ./tests/hello${{ matrix.ext }}

      - name: Smoke test (CLI version)
        shell: bash
        run: |
          ./build/freak${{ matrix.ext }} version

      - name: Package release artifact
        shell: bash
        run: |
          mkdir -p dist/freak/bin dist/freak/runtime
          cp build/freak${{ matrix.ext }} dist/freak/bin/freak${{ matrix.ext }}
          cp build/hangar${{ matrix.ext }} dist/freak/bin/hangar${{ matrix.ext }}
          # Runtime sources keep final linking under the platform Clang
          # driver's CRT/SDK policy on every released target.
          while IFS='|' read -r source destination || [[ -n "$source$destination" ]]; do
            source=${source%$'\r'}
            destination=${destination%$'\r'}
            if [[ -z "$source" || "$source" == \#* ]]; then
              continue
            fi
            mkdir -p "dist/freak/$(dirname "$destination")"
            cp "$source" "dist/freak/$destination"
          done < packaging/distribution-files.manifest
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp freakc/runtime/freak_runtime.obj dist/freak/runtime/
            cp freakc/runtime/freak_llvm_runtime.obj dist/freak/runtime/
            cp freakc/runtime/freak_ui_win32.obj dist/freak/runtime/
          fi
          cp packaging/distribution-files.manifest dist/freak/distribution-files.manifest
          # Standalone binaries for direct download
          cp build/freak${{ matrix.ext }} dist/freak-${{ matrix.target }}${{ matrix.ext }}
          cp build/hangar${{ matrix.ext }} dist/hangar-${{ matrix.target }}${{ matrix.ext }}

      - name: Finalize and smoke exact release archive
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            python - <<'PY'
          import pathlib, zipfile
          dist = pathlib.Path("dist")
          payload = dist / "freak"
          archive = dist / "freak-windows-x64.zip"
          with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED) as output:
              for path in payload.rglob("*"):
                  if path.is_file():
                      output.write(path, path.relative_to(dist))
          PY
            archive="dist/freak-${{ matrix.target }}.zip"
          else
            archive="dist/freak-${{ matrix.target }}.tar.gz"
            (cd dist && tar czf "$(basename "$archive")" freak/)
          fi
          python -u tests/v3_final_release_gate.py \
            --archive "$archive" \
            --freakc "./build/freakc_v3_stage2${{ matrix.ext }}" \
            --standalone-freak "dist/freak-${{ matrix.target }}${{ matrix.ext }}" \
            --standalone-hangar "dist/hangar-${{ matrix.target }}${{ matrix.ext }}" \
            --tested-sha256 "$archive.tested.sha256" \
            --evidence-dir "$RUNNER_TEMP/v35-http-release"

      - name: Upload installed HTTP, template and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v35-http-release-${{ matrix.target }}
          path: ${{ runner.temp }}/v35-http-release/*.json
          if-no-files-found: ignore

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: freak-${{ matrix.target }}
          path: dist/

  publish:
    needs: [version-invariant, build, editors]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Collect finalized release archives
        run: |
          for dir in artifacts/freak-*/; do
            target=$(basename "$dir")
            if echo "$target" | grep -q windows; then
              archive="$target.zip"
            else
              archive="$target.tar.gz"
            fi
            test -s "$dir/$archive"
            sidecar="$dir/$archive.tested.sha256"
            test -s "$sidecar"
            expected=$(awk '{print $1}' "$sidecar")
            actual=$(sha256sum "$dir/$archive" | awk '{print $1}')
            test "$actual" = "$expected"
            mv "$dir/$archive" "artifacts/$archive"
            mv "$sidecar" "artifacts/$archive.tested.sha256"
          done
          ls -la artifacts/*.tar.gz artifacts/*.zip 2>/dev/null || true

      - name: Generate checksums
        run: |
          cd artifacts
          : > SHA256SUMS
          # Release downloads are flattened to their basenames by GitHub.
          # Record those exact public asset names, not artifact-directory paths.
          while IFS= read -r -d '' file; do
            hash=$(sha256sum "$file" | awk '{print $1}')
            printf '%s  %s\n' "$hash" "$(basename "$file")" >> SHA256SUMS
          done < <(find . -type f \( -name "freak-*" -o -name "hangar-*" \) \
            ! -name "*.tested.sha256" -print0)

          # The standalone compatibility path downloads the tagged manifest
          # and its raw payload files.  Bind those bytes to this release too.
          payload_root="freak-linux-x64/freak"
          manifest="$payload_root/distribution-files.manifest"
          test -s "$manifest"
          printf '%s  %s\n' "$(sha256sum "$manifest" | awk '{print $1}')" \
            "raw/packaging/distribution-files.manifest" >> SHA256SUMS
          while IFS='|' read -r source destination || [[ -n "$source$destination" ]]; do
            source=${source%$'\r'}
            destination=${destination%$'\r'}
            if [[ -z "$source" || "$source" == \#* ]]; then continue; fi
            test -s "$payload_root/$destination"
            printf '%s  %s\n' "$(sha256sum "$payload_root/$destination" | awk '{print $1}')" \
              "raw/$source" >> SHA256SUMS
          done < "$manifest"
          sort -k2,2 -o SHA256SUMS SHA256SUMS
          duplicate=$(awk '{count[$2] += 1} END {for (name in count) if (count[name] != 1) print name}' SHA256SUMS)
          test -z "$duplicate" || { echo "::error::duplicate checksum asset(s): $duplicate"; exit 1; }
          cat SHA256SUMS

      - name: Checkout for packaging update
        uses: actions/checkout@v4
        with:
          path: repo
          ref: ${{ needs.version-invariant.outputs.source_commit }}

      - name: Update packaging checksums
        run: |
          # Parse SHA256SUMS and patch packaging files with real hashes
          cd artifacts
          HASH_MACOS=$(awk '$2 == "freak-macos-arm64.tar.gz" {print $1}' SHA256SUMS)
          HASH_LINUX_X64=$(awk '$2 == "freak-linux-x64.tar.gz" {print $1}' SHA256SUMS)
          HASH_LINUX_ARM64=$(awk '$2 == "freak-linux-arm64.tar.gz" {print $1}' SHA256SUMS)
          HASH_WIN=$(awk '$2 == "freak-windows-x64.zip" {print $1}' SHA256SUMS)
          for hash in "$HASH_MACOS" "$HASH_LINUX_X64" "$HASH_LINUX_ARM64" "$HASH_WIN"; do
            if [ -z "$hash" ]; then
              echo "::error::missing distribution checksum"
              exit 1
            fi
          done
          cd ..
          VERSION="${RELEASE_TAG#v}"
          sed -i "s/HOMEBREW_SHA256_MACOS_ARM64_PLACEHOLDER/$HASH_MACOS/g" repo/packaging/homebrew/freak.rb
          sed -i "s/HOMEBREW_SHA256_LINUX_X64_PLACEHOLDER/$HASH_LINUX_X64/g" repo/packaging/homebrew/freak.rb
          sed -i "s/HOMEBREW_SHA256_LINUX_ARM64_PLACEHOLDER/$HASH_LINUX_ARM64/g" repo/packaging/homebrew/freak.rb
          sed -i "s/SCOOP_HASH_PLACEHOLDER/$HASH_WIN/g" repo/packaging/scoop/freak.json
          sed -E -i "s/version \"[0-9]+\.[0-9]+\.[0-9]+\"/version \"$VERSION\"/" repo/packaging/homebrew/freak.rb
          sed -E -i "s/\"version\": \"[0-9]+\.[0-9]+\.[0-9]+\"/\"version\": \"$VERSION\"/" repo/packaging/scoop/freak.json
          sed -E -i "s#/download/v[0-9]+\.[0-9]+\.[0-9]+/#/download/v$VERSION/#" repo/packaging/scoop/freak.json
          # Patch the winget manifest for the version we're releasing.
          # Manifests live under packaging/winget/manifests/F/FREAK/freak/<VERSION>/
          # and must exist before release; commit a new dir per bumped version.
          WINGET_DIR="repo/packaging/winget/manifests/F/FREAK/freak/$VERSION"
          for manifest in FREAK.freak.yaml FREAK.freak.installer.yaml FREAK.freak.locale.en-US.yaml; do
            if [ ! -f "$WINGET_DIR/$manifest" ]; then
              echo "::error::required WinGet manifest missing: $WINGET_DIR/$manifest"
              exit 1
            fi
            tr -d '\r' < "$WINGET_DIR/$manifest" | grep -q "^PackageVersion: $VERSION$" || {
              echo "::error::WinGet manifest version mismatch: $manifest"
              exit 1
            }
          done
          sed -i "s/WINGET_HASH_PLACEHOLDER/$HASH_WIN/g" "$WINGET_DIR/FREAK.freak.installer.yaml"
          tr -d '\r' < "$WINGET_DIR/FREAK.freak.installer.yaml" | grep -q "^    InstallerSha256: $HASH_WIN$" || {
            echo "::error::WinGet installer checksum was not patched"
            exit 1
          }
          if grep -R -q 'PLACEHOLDER' "$WINGET_DIR"; then
            echo "::error::unresolved WinGet placeholder"
            exit 1
          fi
          mkdir -p artifacts/package-manager/winget
          cp repo/packaging/homebrew/freak.rb artifacts/package-manager/freak.rb
          cp repo/packaging/scoop/freak.json artifacts/package-manager/freak.json
          # A WinGet submission is a version, installer, and locale manifest
          # set. Publish the complete validated set with the patched hash.
          cp "$WINGET_DIR"/*.yaml artifacts/package-manager/winget/
          echo "Checksums injected for $VERSION"
          cat repo/packaging/scoop/freak.json

      - name: Create GitHub Release without replacing an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ needs.version-invariant.outputs.source_commit }}
        run: |
          # Recheck on every publishing attempt, including a rerun of this job.
          can_publish=$(gh api graphql \
            -f query='query($repoOwner: String!, $repoName: String!, $tag: String!) { repository(owner: $repoOwner, name: $repoName) { release(tagName: $tag) { id } } }' \
            -f repoOwner="${GITHUB_REPOSITORY%/*}" \
            -f repoName="${GITHUB_REPOSITORY#*/}" \
            -f tag="$RELEASE_TAG" \
            --jq '.data.repository != null and .data.repository.release == null')
          test "$can_publish" = "true"
          python - <<'PY'
          import glob
          import hashlib
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]
          token = os.environ["GH_TOKEN"]
          api_root = f"https://api.github.com/repos/{repo}/releases"
          patterns = [
              "artifacts/freak-linux-x64/freak-linux-x64",
              "artifacts/freak-linux-x64/hangar-linux-x64",
              "artifacts/freak-linux-arm64/freak-linux-arm64",
              "artifacts/freak-linux-arm64/hangar-linux-arm64",
              "artifacts/freak-macos-arm64/freak-macos-arm64",
              "artifacts/freak-macos-arm64/hangar-macos-arm64",
              "artifacts/freak-windows-x64/freak-windows-x64.exe",
              "artifacts/freak-windows-x64/hangar-windows-x64.exe",
              "artifacts/freak-linux-x64.tar.gz",
              "artifacts/freak-linux-arm64.tar.gz",
              "artifacts/freak-macos-arm64.tar.gz",
              "artifacts/freak-windows-x64.zip",
              "artifacts/editor-packages/freak-vscode-*.vsix",
              "artifacts/editor-packages/freak-zed-*.zip",
              "artifacts/SHA256SUMS",
              "artifacts/package-manager/freak.rb",
              "artifacts/package-manager/freak.json",
              "artifacts/package-manager/winget/*.yaml",
          ]
          assets = []
          for pattern in patterns:
              matches = sorted(pathlib.Path(p) for p in glob.glob(pattern))
              if not matches or any(not p.is_file() or p.stat().st_size == 0 for p in matches):
                  raise RuntimeError(f"Missing or empty release asset: {pattern}")
              assets.extend(matches)
          if len(assets) != 20 or len({p.name for p in assets}) != len(assets):
              raise RuntimeError("Expected 20 uniquely named release assets")
          notes = pathlib.Path(f"repo/docs/releases/{tag}.md").read_text(encoding="utf-8")
          if not notes.strip():
              raise RuntimeError("Release notes must not be empty")

          def request(method, url, payload, content_type="application/json"):
              data = None if payload is None else (json.dumps(payload).encode() if content_type == "application/json" else payload)
              req = urllib.request.Request(url, data=data, method=method, headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": content_type,
              })
              with urllib.request.urlopen(req, timeout=60) as response:
                  if response.status != (201 if method == "POST" else 200):
                      raise RuntimeError(f"Unexpected {method} response status: {response.status}")
                  return json.load(response)

          def require_source_tag():
              ref_url = f"https://api.github.com/repos/{repo}/git/ref/tags/{urllib.parse.quote(tag, safe='')}"
              target = request("GET", ref_url, None)["object"]
              visited = set()
              while target["type"] == "tag":
                  if target["sha"] in visited:
                      raise RuntimeError("Cyclic annotated tag response")
                  visited.add(target["sha"])
                  target = request("GET", f"https://api.github.com/repos/{repo}/git/tags/{target['sha']}", None)["object"]
              if target["type"] != "commit" or target["sha"] != os.environ["SOURCE_COMMIT"]:
                  raise RuntimeError("Release tag no longer matches the verified source commit")

          # POST creates a new release; it never updates one found by tag.
          # GitHub can allow duplicate drafts, so check for those explicitly too.
          # Keep our new release a draft until every upload has succeeded.
          require_source_tag()
          release = request("POST", api_root, {
              # The verified tag already exists. Omit the unused target_commitish
              # so token authorization resolves against the default branch.
              "tag_name": tag,
              "name": tag, "body": notes, "draft": True, "prerelease": False,
          })
          release_id = release["id"]
          if type(release_id) is not int or release_id <= 0 or release["tag_name"] != tag or release["draft"] is not True:
              raise RuntimeError("Unexpected create-release response")

          def require_sole_draft():
              # The release listing lags behind creation, so it cannot prove our
              # own draft exists. Read that by ID; use the listing for conflicts.
              own = request("GET", f"{api_root}/{release_id}", None)
              if own["id"] != release_id or own["tag_name"] != tag or own["draft"] is not True:
                  raise RuntimeError("Our draft release is not intact; refusing publication")
              page = 1
              while True:
                  releases = request("GET", f"{api_root}?per_page=100&page={page}", None)
                  for existing in releases:
                      if existing["tag_name"] != tag:
                          continue
                      if existing["id"] != release_id or existing["draft"] is not True:
                          raise RuntimeError("Another release already exists for this tag")
                  if len(releases) < 100:
                      break
                  page += 1

          def discard_own_draft():
              # An abandoned draft blocks every later attempt. Remove only the
              # still-unpublished ID created above; never touch any other release.
              try:
                  own = request("GET", f"{api_root}/{release_id}", None)
                  if own["id"] != release_id or own["draft"] is not True:
                      return
                  req = urllib.request.Request(f"{api_root}/{release_id}", method="DELETE", headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  })
                  with urllib.request.urlopen(req, timeout=60):
                      pass
                  print(f"Discarded unpublished draft {release_id}")
              except Exception as cleanup_error:
                  print(f"::warning::could not discard draft {release_id}: {cleanup_error}")

          try:
              require_sole_draft()
              upload_root = f"https://uploads.github.com/repos/{repo}/releases/{release_id}/assets"
              for path in assets:
                  data = path.read_bytes()
                  uploaded = request("POST", f"{upload_root}?name={urllib.parse.quote(path.name, safe='')}",
                                     data, "application/octet-stream")
                  if uploaded["name"] != path.name or uploaded["size"] != len(data) or uploaded["state"] != "uploaded":
                      raise RuntimeError(f"Upload metadata mismatch: {path.name}")
                  if uploaded.get("digest") not in (None, "sha256:" + hashlib.sha256(data).hexdigest()):
                      raise RuntimeError(f"Upload digest mismatch: {path.name}")
                  print(f"Uploaded {path.name}")
              # Recheck conflicts after uploads, then publish only the ID we created.
              # A concurrent publication error is fatal; never adopt or retry against its ID.
              require_sole_draft()
              require_source_tag()
          except BaseException:
              discard_own_draft()
              raise
          published = request("PATCH", f"{api_root}/{release_id}", {"draft": False})
          if published["id"] != release_id or published["tag_name"] != tag or published["draft"] is not False:
              raise RuntimeError("Release did not become public")
          print(published["html_url"])
          PY
