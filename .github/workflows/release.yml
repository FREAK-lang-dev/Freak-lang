name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            ext: ""
          - os: ubuntu-24.04-arm
            target: linux-arm64
            ext: ""
          - os: macos-latest
            target: macos-arm64
            ext: ""
          - os: macos-13
            target: macos-x64
            ext: ""
          - os: windows-latest
            target: windows-x64
            ext: ".exe"
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Clang (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang lld

      - name: Install Clang (Windows)
        if: runner.os == 'Windows'
        run: choco install llvm -y

      - name: Set platform linker flags
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            echo "LINK_FLAGS=-lm" >> "$GITHUB_ENV"
          else
            echo "LINK_FLAGS=" >> "$GITHUB_ENV"
          fi

      - name: Build freakc compiler
        shell: bash
        run: |
          # Stage 0: Python bootstraps the self-hosting compiler
          python -m freakc build self_hosted/main.fk -o self_hosted/freakc_self.exe --keep-c

          # Stage 1: Concatenate and compile v2
          cat src/compiler/ast.fk src/compiler/lexer.fk src/compiler/parser.fk src/compiler/checker.fk src/compiler/emitter.fk src/compiler/backend/llvm.fk src/compiler/main.fk > build/freakc_v2.fk
          ./self_hosted/freakc_self.exe build/freakc_v2.fk
          clang -o build/freakc_v2${{ matrix.ext }} build/freakc_v2.fk.c freakc/runtime/freak_runtime.c -Ifreakc/runtime -w -O3 -D_CRT_SECURE_NO_WARNINGS $LINK_FLAGS

      - name: Smoke test
        shell: bash
        run: |
          ./build/freakc_v2${{ matrix.ext }} tests/hello.fk
          clang -o tests/hello_release${{ matrix.ext }} tests/hello.fk.c freakc/runtime/freak_runtime.c -Ifreakc/runtime -w -O2 -D_CRT_SECURE_NO_WARNINGS $LINK_FLAGS
          ./tests/hello_release${{ matrix.ext }}

      - name: Package release artifact
        shell: bash
        run: |
          mkdir -p dist
          cp build/freakc_v2${{ matrix.ext }} dist/freakc-${{ matrix.target }}${{ matrix.ext }}
          cp -r freakc/runtime dist/runtime
          cp -r std dist/std 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: freakc-${{ matrix.target }}
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f \( -name "freakc-*" \) -exec sha256sum {} \; | sort > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/freakc-linux-x64/freakc-linux-x64
            artifacts/freakc-linux-arm64/freakc-linux-arm64
            artifacts/freakc-macos-x64/freakc-macos-x64
            artifacts/freakc-macos-arm64/freakc-macos-arm64
            artifacts/freakc-windows-x64/freakc-windows-x64.exe
            artifacts/SHA256SUMS
