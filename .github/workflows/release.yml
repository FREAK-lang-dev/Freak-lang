name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            ext: ""
          - os: ubuntu-24.04-arm
            target: linux-arm64
            ext: ""
          - os: macos-latest
            target: macos-arm64
            ext: ""
          - os: windows-latest
            target: windows-x64
            ext: ".exe"
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Clang (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang lld

      - name: Install Clang (Windows)
        if: runner.os == 'Windows'
        run: choco install llvm -y

      - name: Set platform linker flags
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            echo "LINK_FLAGS=-lm" >> "$GITHUB_ENV"
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "LINK_FLAGS=-lws2_32" >> "$GITHUB_ENV"
          else
            echo "LINK_FLAGS=" >> "$GITHUB_ENV"
          fi

      - name: Build V3 compiler (Stage 0 — link pre-compiled bootstrap)
        shell: bash
        run: |
          cat src/compiler/v3/globals.fk src/compiler/v3/helpers.fk src/compiler/v3/lexer.fk src/compiler/v3/parser.fk src/compiler/v3/emit_c.fk src/compiler/v3/emit_llvm.fk src/compiler/v3/main.fk > build/freakc_v3.fk
          clang -o build/freakc_v3${{ matrix.ext }} build/freakc_v3.fk.c freakc/runtime/freak_runtime.c -Ifreakc/runtime -w -O2 -D_CRT_SECURE_NO_WARNINGS $LINK_FLAGS

      - name: Build full CLI (Stage 1 — V3 compiler + CLI + Hangar)
        shell: bash
        run: |
          mkdir -p build
          rm -f build/freakc_cli.fk
          cat std/version.fk >> build/freakc_cli.fk
          cat src/compiler/v3/globals.fk >> build/freakc_cli.fk
          cat src/compiler/v3/helpers.fk >> build/freakc_cli.fk
          cat src/compiler/v3/lexer.fk >> build/freakc_cli.fk
          cat src/compiler/v3/parser.fk >> build/freakc_cli.fk
          cat src/compiler/v3/emit_c.fk >> build/freakc_cli.fk
          cat src/compiler/v3/emit_llvm.fk >> build/freakc_cli.fk
          cat src/cli/version.fk >> build/freakc_cli.fk
          cat src/cli/toml.fk >> build/freakc_cli.fk
          cat src/cli/lockfile.fk >> build/freakc_cli.fk
          cat src/cli/build.fk >> build/freakc_cli.fk
          cat src/cli/run.fk >> build/freakc_cli.fk
          cat src/cli/hangar.fk >> build/freakc_cli.fk
          cat src/cli/doctor.fk >> build/freakc_cli.fk
          cat src/cli/main.fk >> build/freakc_cli.fk
          ./build/freakc_v3${{ matrix.ext }} build/freakc_cli.fk --c
          clang -o build/freak${{ matrix.ext }} build/freakc_cli.fk.c freakc/runtime/freak_runtime.c -Ifreakc/runtime -O2 -w -D_CRT_SECURE_NO_WARNINGS $LINK_FLAGS
          # Create hangar binary (same binary, BusyBox pattern)
          cp build/freak${{ matrix.ext }} build/hangar${{ matrix.ext }}

      - name: Smoke test (CLI build command)
        shell: bash
        run: |
          ./build/freak${{ matrix.ext }} build tests/hello.fk
          ./tests/hello${{ matrix.ext }}

      - name: Smoke test (CLI version)
        shell: bash
        run: |
          ./build/freak${{ matrix.ext }} version

      - name: Pre-compile runtime to .o
        shell: bash
        run: |
          clang -c freakc/runtime/freak_runtime.c -Ifreakc/runtime -O2 -w -D_CRT_SECURE_NO_WARNINGS $LINK_FLAGS -o freakc/runtime/freak_runtime.o
          clang -c freakc/runtime/freak_llvm_runtime.c -Ifreakc/runtime -O2 -w -D_CRT_SECURE_NO_WARNINGS $LINK_FLAGS -o freakc/runtime/freak_llvm_runtime.o

      - name: Package release artifact
        shell: bash
        run: |
          mkdir -p dist/freak/bin dist/freak/runtime dist/freak/std
          cp build/freak${{ matrix.ext }} dist/freak/bin/freak${{ matrix.ext }}
          cp build/hangar${{ matrix.ext }} dist/freak/bin/hangar${{ matrix.ext }}
          # Ship pre-compiled .o files (preferred) + .c/.h source (fallback)
          cp freakc/runtime/freak_runtime.o dist/freak/runtime/
          cp freakc/runtime/freak_llvm_runtime.o dist/freak/runtime/
          cp freakc/runtime/freak_runtime.c dist/freak/runtime/
          cp freakc/runtime/freak_runtime.h dist/freak/runtime/
          cp freakc/runtime/freak_llvm_runtime.c dist/freak/runtime/
          # Ship standard library
          cp std/math.fk dist/freak/std/
          cp std/string.fk dist/freak/std/
          cp std/convert.fk dist/freak/std/
          cp std/algorithm.fk dist/freak/std/
          cp std/json.fk dist/freak/std/
          cp std/http.fk dist/freak/std/
          cp std/version.fk dist/freak/std/
          cp std/runtime.fk dist/freak/std/
          # Standalone binaries for direct download
          cp build/freak${{ matrix.ext }} dist/freak-${{ matrix.target }}${{ matrix.ext }}
          cp build/hangar${{ matrix.ext }} dist/hangar-${{ matrix.target }}${{ matrix.ext }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: freak-${{ matrix.target }}
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f \( -name "freak-*" -o -name "hangar-*" \) -exec sha256sum {} \; | sort > SHA256SUMS
          cat SHA256SUMS

      - name: Package distributions as tarballs/zips
        run: |
          for dir in artifacts/freak-*/; do
            target=$(basename "$dir")
            if [ -d "$dir/freak" ]; then
              if echo "$target" | grep -q windows; then
                # ZIP for Windows
                (cd "$dir" && zip -r "../$target.zip" freak/)
              else
                # tar.gz for Linux/macOS
                (cd "$dir" && tar czf "../$target.tar.gz" freak/)
              fi
            fi
          done
          ls -la artifacts/*.tar.gz artifacts/*.zip 2>/dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/freak-linux-x64/freak-linux-x64
            artifacts/freak-linux-x64/hangar-linux-x64
            artifacts/freak-linux-arm64/freak-linux-arm64
            artifacts/freak-linux-arm64/hangar-linux-arm64
            artifacts/freak-macos-arm64/freak-macos-arm64
            artifacts/freak-macos-arm64/hangar-macos-arm64
            artifacts/freak-windows-x64/freak-windows-x64.exe
            artifacts/freak-windows-x64/hangar-windows-x64.exe
            artifacts/freak-linux-x64.tar.gz
            artifacts/freak-linux-arm64.tar.gz
            artifacts/freak-macos-arm64.tar.gz
            artifacts/freak-windows-x64.zip
            artifacts/SHA256SUMS
