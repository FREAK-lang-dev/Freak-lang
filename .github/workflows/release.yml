name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            ext: ""
          - os: ubuntu-24.04-arm
            target: linux-arm64
            ext: ""
          - os: macos-latest
            target: macos-arm64
            ext: ""
          - os: windows-latest
            target: windows-x64
            ext: ".exe"
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Clang (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang lld

      - name: Install Clang (Windows)
        if: runner.os == 'Windows'
        run: choco install llvm -y

      - name: Set platform linker flags
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            echo "LINK_FLAGS=-lm" >> "$GITHUB_ENV"
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "LINK_FLAGS=-lws2_32" >> "$GITHUB_ENV"
          else
            echo "LINK_FLAGS=" >> "$GITHUB_ENV"
          fi

      - name: Build freakc compiler
        shell: bash
        run: |
          # Stage 0: Python bootstraps the self-hosting compiler
          python -m freakc build self_hosted/main.fk -o self_hosted/freakc_self.exe --keep-c

          # Stage 1: Concatenate and compile v2 (transpile-only compiler)
          cat src/compiler/ast.fk src/compiler/lexer.fk src/compiler/parser.fk src/compiler/checker.fk src/compiler/emitter.fk src/compiler/backend/llvm.fk src/compiler/main.fk > build/freakc_v2.fk
          ./self_hosted/freakc_self.exe build/freakc_v2.fk
          clang -o build/freakc_v2${{ matrix.ext }} build/freakc_v2.fk.c freakc/runtime/freak_runtime.c -Ifreakc/runtime -w -O3 -D_CRT_SECURE_NO_WARNINGS $LINK_FLAGS

          # Stage 2: Build full CLI binary (compiler + CLI + Hangar)
          mkdir -p build
          rm -f build/freakc_cli.fk
          cat std/version.fk >> build/freakc_cli.fk
          cat src/compiler/ast.fk >> build/freakc_cli.fk
          cat src/compiler/lexer.fk >> build/freakc_cli.fk
          cat src/compiler/parser.fk >> build/freakc_cli.fk
          cat src/compiler/checker.fk >> build/freakc_cli.fk
          cat src/compiler/emitter.fk >> build/freakc_cli.fk
          cat src/compiler/backend/llvm.fk >> build/freakc_cli.fk
          cat src/cli/version.fk >> build/freakc_cli.fk
          cat src/cli/toml.fk >> build/freakc_cli.fk
          cat src/cli/build.fk >> build/freakc_cli.fk
          cat src/cli/run.fk >> build/freakc_cli.fk
          cat src/cli/hangar.fk >> build/freakc_cli.fk
          cat src/cli/doctor.fk >> build/freakc_cli.fk
          cat src/cli/main.fk >> build/freakc_cli.fk
          ./build/freakc_v2${{ matrix.ext }} build/freakc_cli.fk --c
          clang -o build/freakc${{ matrix.ext }} build/freakc_cli.fk.c freakc/runtime/freak_runtime.c -Ifreakc/runtime -O2 -w -D_CRT_SECURE_NO_WARNINGS $LINK_FLAGS

      - name: Smoke test (CLI build command)
        shell: bash
        run: |
          ./build/freakc${{ matrix.ext }} build tests/hello.fk
          ./tests/hello${{ matrix.ext }}

      - name: Smoke test (CLI version)
        shell: bash
        run: |
          ./build/freakc${{ matrix.ext }} version

      - name: Pre-compile runtime to .o
        shell: bash
        run: |
          clang -c freakc/runtime/freak_runtime.c -Ifreakc/runtime -O2 -w -D_CRT_SECURE_NO_WARNINGS $LINK_FLAGS -o freakc/runtime/freak_runtime.o
          clang -c freakc/runtime/freak_llvm_runtime.c -Ifreakc/runtime -O2 -w -D_CRT_SECURE_NO_WARNINGS $LINK_FLAGS -o freakc/runtime/freak_llvm_runtime.o

      - name: Package release artifact
        shell: bash
        run: |
          mkdir -p dist/freak/bin dist/freak/runtime dist/freak/std
          cp build/freakc${{ matrix.ext }} dist/freak/bin/freakc${{ matrix.ext }}
          # Ship pre-compiled .o files (preferred) + .c/.h source (fallback)
          cp freakc/runtime/freak_runtime.o dist/freak/runtime/
          cp freakc/runtime/freak_llvm_runtime.o dist/freak/runtime/
          cp freakc/runtime/freak_runtime.c dist/freak/runtime/
          cp freakc/runtime/freak_runtime.h dist/freak/runtime/
          cp freakc/runtime/freak_llvm_runtime.c dist/freak/runtime/
          # Ship standard library
          cp std/math.fk dist/freak/std/
          cp std/string.fk dist/freak/std/
          cp std/convert.fk dist/freak/std/
          cp std/algorithm.fk dist/freak/std/
          cp std/json.fk dist/freak/std/
          cp std/http.fk dist/freak/std/
          cp std/version.fk dist/freak/std/
          cp std/runtime.fk dist/freak/std/
          # Also keep standalone binary for backwards compat with install scripts
          cp build/freakc${{ matrix.ext }} dist/freakc-${{ matrix.target }}${{ matrix.ext }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: freakc-${{ matrix.target }}
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f \( -name "freakc-*" \) -exec sha256sum {} \; | sort > SHA256SUMS
          cat SHA256SUMS

      - name: Package distributions as tarballs/zips
        run: |
          for dir in artifacts/freakc-*/; do
            target=$(basename "$dir")
            if [ -d "$dir/freak" ]; then
              if echo "$target" | grep -q windows; then
                # ZIP for Windows
                (cd "$dir" && zip -r "../$target.zip" freak/)
              else
                # tar.gz for Linux/macOS
                (cd "$dir" && tar czf "../$target.tar.gz" freak/)
              fi
            fi
          done
          ls -la artifacts/*.tar.gz artifacts/*.zip 2>/dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/freakc-linux-x64/freakc-linux-x64
            artifacts/freakc-linux-arm64/freakc-linux-arm64
            artifacts/freakc-macos-arm64/freakc-macos-arm64
            artifacts/freakc-windows-x64/freakc-windows-x64.exe
            artifacts/freakc-linux-x64.tar.gz
            artifacts/freakc-linux-arm64.tar.gz
            artifacts/freakc-macos-arm64.tar.gz
            artifacts/freakc-windows-x64.zip
            artifacts/SHA256SUMS
