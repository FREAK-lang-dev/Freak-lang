name: V4 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  v4-differential-frontend:
    name: V3/V4 frontend differential
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Differential source identity regressions
        run: python -B -u -m unittest discover -s tests/v4_differential -p "test_*.py" -v

      - name: Install Clang
        run: sudo apt-get update && sudo apt-get install -y clang lld

      - name: Build current V3 CLI in isolation
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/freak-v4-differential"
          mkdir -p "$root"
          cat \
            src/compiler/v3/globals.fk \
            src/compiler/v3/helpers.fk \
            src/compiler/v3/lexer.fk \
            src/compiler/v3/parser.fk \
            src/compiler/v3/checker.fk \
            src/compiler/v3/emit_c.fk \
            src/compiler/v3/emit_llvm.fk \
            src/compiler/v3/main.fk \
            > "$root/freakc_v3.fk"
          clang -o "$root/freakc_seed" build/freakc_v3.fk.c \
            freakc/runtime/freak_runtime.c -Ifreakc/runtime -w -O0 -lm
          "$root/freakc_seed" "$root/freakc_v3.fk" --c
          clang -o "$root/freakc_stage2" "$root/freakc_v3.fk.c" \
            freakc/runtime/freak_runtime.c -Ifreakc/runtime -w -O0 -lm
          cat \
            std/version.fk \
            src/compiler/v3/globals.fk \
            src/compiler/v3/helpers.fk \
            src/compiler/v3/lexer.fk \
            src/compiler/v3/parser.fk \
            src/compiler/v3/checker.fk \
            src/compiler/v3/emit_c.fk \
            src/compiler/v3/emit_llvm.fk \
            src/cli/version.fk \
            src/cli/toml.fk \
            src/cli/lockfile.fk \
            src/cli/build.fk \
            src/cli/run.fk \
            src/cli/hangar.fk \
            src/cli/doctor.fk \
            src/cli/audit.fk \
            src/cli/main.fk \
            > "$root/freakc_cli.fk"
          "$root/freakc_stage2" "$root/freakc_cli.fk" --c
          clang -o "$root/freak" "$root/freakc_cli.fk.c" \
            freakc/runtime/freak_runtime.c -Ifreakc/runtime -w -O0 -lm
          echo "FREAK_DIFFERENTIAL_V3=$root/freak" >> "$GITHUB_ENV"

      - name: Generated V4 probe contract
        run: python -u src/compiler/v4/tools/campaign_probe.py --self-test --clang clang

      - name: Differential campaign gate
        run: >
          python -u tests/v4_differential/run_differential.py
          "$FREAK_DIFFERENTIAL_V3" --clang clang

  v4-fast:
    name: V4 fast (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Conformance and tooling contract audit
        run: python -m freakc audit-conformance

      - name: V4 boundary guard regression tests
        run: python -B -u -m unittest discover -s tests/v4_review_guards -v

      - name: V4 structural and transpile coverage
        run: python -u src/compiler/v4/check_v4.py --fast

  v4-native-platforms:
    name: V4 native backend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        run: choco install llvm -y

      - name: Native LLVM programs, H6 correctness and extern integration
        run: >
          python -u src/compiler/v4/check_v4.py
          --smoke h6_
          --smoke release_native_ordinary_
          --smoke owned_word_
          --smoke codegen_llvm_execute
          --smoke extern_literal_syntax
          --smoke extern_return

  v4-runtime-helpers:
    name: V4 native runtime helpers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Clang (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang lld

      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        run: choco install llvm -y

      - name: Owned UTF-8 word runtime portability and ownership audits
        run: python -B -u tests/v4_word_runtime.py --plain

      - name: Unicode fatal-error oracle regressions
        run: python -B -u -m unittest discover -s tests -p test_v4_unicode_runtime.py -v

      - name: Checked numeric helpers at O0, O2 and O3
        run: python -B -u tests/v4_numeric_runtime.py

      - name: Checked numeric native gate oracle regressions
        run: python -B -u -m unittest discover -s tests -p test_v4_checked_numeric_codegen.py -v

      - name: Checked numeric native lowering at O0, O2 and O3
        run: python -B -u tests/v4_checked_numeric_codegen.py --plain --snapshot-control --json "${{ runner.temp }}/numeric-codegen-plain.json"

      - name: Generated owned word programs with C and LLVM ownership audits
        run: python -B -u tests/v4_owned_word_codegen.py --plain

      - name: Owned process and checked filesystem runtime portability
        run: python -B -u tests/v4_system_runtime.py --plain

      - name: Unicode lowercase runtime portability
        run: python -B -u tests/v4_unicode_runtime.py --plain --download --ucd-dir "${{ runner.temp }}/freak-unicode-17" --report "${{ runner.temp }}/unicode-lower-plain.json"

      - name: Windows suite fresh-build and exit-status regressions
        if: runner.os == 'Windows'
        run: python -B -u tests/test_windows_suite_runner.py

      - name: Owned word AddressSanitizer and UndefinedBehaviorSanitizer gate
        if: runner.os == 'Linux'
        run: python -B -u tests/v4_word_runtime.py

      - name: Generated owned word AddressSanitizer and UndefinedBehaviorSanitizer gate
        if: runner.os == 'Linux'
        run: python -B -u tests/v4_owned_word_codegen.py

      - name: Owned process and filesystem sanitizer gate
        if: runner.os == 'Linux'
        run: python -B -u tests/v4_system_runtime.py

      - name: Unicode lowercase sanitizer gate
        if: runner.os == 'Linux'
        run: python -B -u tests/v4_unicode_runtime.py --download --ucd-dir "${{ runner.temp }}/freak-unicode-17" --report "${{ runner.temp }}/unicode-lower-sanitized.json"

      - name: Checked numeric UndefinedBehaviorSanitizer gate
        if: runner.os == 'Linux'
        run: python -B -u tests/v4_numeric_runtime.py --optimization 2 --sanitize

      - name: Checked numeric generated-code sanitizer and ownership gate
        if: runner.os == 'Linux'
        run: python -B -u tests/v4_checked_numeric_codegen.py --snapshot-control --json "${{ runner.temp }}/numeric-codegen-sanitized.json"

      - name: Preserve Unicode runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-unicode-runtime-${{ matrix.os }}
          path: ${{ runner.temp }}/unicode-lower-*.json
          if-no-files-found: warn

      - name: Preserve checked numeric compiler and native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-numeric-codegen-${{ matrix.os }}
          path: ${{ runner.temp }}/numeric-codegen-*.json
          if-no-files-found: warn

  v4-benchmark:
    name: V4 benchmark instrumentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Clang
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm

      - name: Benchmark failure and instrumentation regressions
        run: python -B -u -m unittest discover -s tests -p test_v4_scale_bench.py -v

      - name: Build instrumented compiler and execute a measured program
        env:
          V4_BENCH_TMP: ${{ runner.temp }}
        run: >
          python -u v4_scale_bench.py --shapes tasks --sizes 1 --check
          --timeout 60 --build-timeout 300
          --work "$V4_BENCH_TMP/v4-benchmark-smoke"
          --json "$V4_BENCH_TMP/v4-benchmark-smoke.json"

      - name: Preserve benchmark smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-benchmark-smoke
          path: ${{ runner.temp }}/v4-benchmark-smoke.json
          if-no-files-found: ignore

  v4-runtime-linux:
    name: V4 runtime linux (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/6", "2/6", "3/6", "4/6", "5/6", "6/6"]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Clang
        run: sudo apt-get update && sudo apt-get install -y clang lld

      - name: V4 executable smoke shard
        run: >
          python -u src/compiler/v4/check_v4.py
          --smoke-exclude unit_snapshot_smoke.fk
          --smoke-exclude unit_snapshot_const_smoke.fk
          --smoke-exclude unit_snapshot_diff_smoke.fk
          --smoke-shard ${{ matrix.shard }}

  v4-runtime-linux-unit-snapshot:
    name: V4 runtime linux (unit snapshot)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Clang
        run: sudo apt-get update && sudo apt-get install -y clang lld

      - name: V4 unit snapshot runtime smoke
        run: python -u src/compiler/v4/check_v4.py --smoke unit_snapshot_smoke

  v4-runtime-linux-unit-snapshot-diff:
    name: V4 runtime linux (unit snapshot diff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Clang
        run: sudo apt-get update && sudo apt-get install -y clang lld

      - name: V4 unit snapshot diff runtime smoke
        run: python -u src/compiler/v4/check_v4.py --smoke unit_snapshot_diff_smoke

  v4-runtime-linux-unit-snapshot-const:
    name: V4 runtime linux (unit snapshot const)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Clang
        run: sudo apt-get update && sudo apt-get install -y clang lld

      - name: V4 unit snapshot const runtime smoke
        run: python -u src/compiler/v4/check_v4.py --smoke unit_snapshot_const_smoke

  v4-runtime-windows:
    name: V4 runtime windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install LLVM
        run: choco install llvm -y

      - name: V4 representative runtime smokes
        run: >
          python -u src/compiler/v4/check_v4.py
          --smoke query_invalidation
          --smoke unit_snapshot
          --smoke diagnostics_query
          --smoke lsp
          --smoke global_const
          --smoke borrowck
