ShortDescription: A compiled, statically-typed, memory-safe systems programming language with anime aesthetics.
Description: |-
  FREAK is a compiled, statically-typed, memory-safe systems programming language
  with syntax and aesthetics inspired by anime and visual novels. It transpiles to
  native binaries via an LLVM IR backend. Includes the Hangar package manager.

  Features:
  - Self-hosting compiler (freakc_self.exe compiles itself)
  - LLVM IR backend with cross-compilation support
  - Hangar package manager (hangar.toml)
  - Standard library: std::fs, std::math, std::json, std::http, std::process, std::ui, and more
  - Operator overloading, closures, maybe<T>/result<T,E>, pattern matching
  - Unique language constructs: training arc, foreshadow/payoff, deus_ex_machina, isekai
